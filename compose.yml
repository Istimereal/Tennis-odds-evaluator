
   services:
     postgres:
       image: postgres:17
       container_name: tennis-postgres
       restart: unless-stopped
       environment:
         POSTGRES_DB: tennis
         POSTGRES_USER: postgres
         POSTGRES_PASSWORD: postgres
       ports:
         - "5433:5432"
       volumes:
         - tennis_postgres_data:/var/lib/postgresql/data
       healthcheck:
         test: ["CMD-SHELL", "pg_isready -U postgres -d tennis"]
         interval: 5s
         timeout: 5s
         retries: 10

   volumes:
     tennis_postgres_data:
   